apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-k8s-app
  labels:
    app: jenkins-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jenkins-k8s-app
  template:
    metadata:
      labels:
        app: jenkins-k8s-app
    spec:
      containers:
      - name: jenkins-k8s-app
        image: IMAGE_NAME   # replaced dynamically in pipeline
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
